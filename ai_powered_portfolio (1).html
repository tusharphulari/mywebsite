<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tushar Phulari | AI Interactive Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 4s ease-in-out infinite',
            'wave': 'wave 2s ease-in-out infinite'
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-8px)' }
            },
            wave: {
              '0%, 100%': { transform: 'rotate(0deg)' },
              '20%': { transform: 'rotate(14deg)' },
              '40%': { transform: 'rotate(-10deg)' },
              '60%': { transform: 'rotate(12deg)' },
              '80%': { transform: 'rotate(-4deg)' },
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Interactive WebGL Fluid Simulation Engine -->
  <script src="webgl-fluid.js" onerror="this.onerror=null; this.src='https://cdn.jsdelivr.net/npm/webgl-fluid@0.4/dist/webgl-fluid.umd.min.js';"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    .font-heading {
      font-family: 'Outfit', sans-serif;
    }

    /* Hide scrollbars but allow smooth scrolling */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Interactive WebGL Fluid Simulation Backdrop Canvas */
    #fluid-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .dark #fluid-canvas {
      opacity: 1;
    }

    .chat-bubble {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }

    /* Smooth typing cursor animation */
    .typing-cursor::after {
      content: '|';
      animation: blink 1s step-start infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    .project-card {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .project-card:hover {
      transform: translateY(-6px) scale(1.01);
    }

    /* Character wave arm keyframe animation */
    @keyframes waveMotion {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-4deg); }
      40% { transform: rotate(4deg); }
      60% { transform: rotate(-3deg); }
      80% { transform: rotate(2deg); }
    }
    .character-waving {
      animation: waveMotion 1.4s ease-in-out;
      transform-origin: 50% 85%;
    }

    /* Drawer backdrop transitions */
    .drawer-open {
      transform: translateY(0%);
    }
    .drawer-closed {
      transform: translateY(100%);
    }
  </style>
</head>

          <button data-quick-q="Where are you currently located and are you available to join immediately?" class="quick-question-item w-full flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 font-medium transition-all text-left">
            <span>Where are you based & availability?</span>
            <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
          </button>
          <button data-quick-q="Why should an MNC in Dubai hire you for Business Development?" class="quick-question-item w-full flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 font-medium transition-all text-left">

  <script>
    /* Interactive WebGL Fluid Simulation Engine (Liquid & Smoke Dynamics) */
    const canvas = document.getElementById('fluid-canvas');

    function initFluidSimulation() {
      if (typeof WebGLFluid !== 'undefined') {
        try {
          WebGLFluid(canvas, {
            IMMEDIATE: false,
            TRIGGER: 'hover',
            AUTO: false,
            SIM_RESOLUTION: 128,
            DYE_RESOLUTION: 1024,
            CAPTURE_RESOLUTION: 512,
            DENSITY_DISSIPATION: 0.85,
            VELOCITY_DISSIPATION: 0.95,
            PRESSURE: 0.8,
            PRESSURE_ITERATIONS: 20,
            CURL: 30,
            SPLAT_RADIUS: 0.28,
            SPLAT_FORCE: 5500,
            SPLAT_COUNT: 1,
            SHADING: false,
            COLORFUL: true,
            COLOR_UPDATE_SPEED: 10,
            PAUSED: false,
            BACK_COLOR: { r: 0, g: 0, b: 0 },
            TRANSPARENT: true,
            BLOOM: false,
            SUNRAYS: false,
          });
          return;
        } catch (err) {
          console.warn('WebGL Fluid Simulation init error, falling back:', err);
        }
      }
      initFallbackFluid();
    }

    function initFallbackFluid() {
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const blobs = [
        { x: width * 0.2, y: height * 0.3, vx: 0.6, vy: 0.4, r: 240, color: 'rgba(254, 215, 170, 0.45)' },
        { x: width * 0.8, y: height * 0.2, vx: -0.5, vy: 0.6, r: 280, color: 'rgba(244, 114, 182, 0.35)' },
        { x: width * 0.5, y: height * 0.7, vx: 0.4, vy: -0.5, r: 320, color: 'rgba(167, 243, 208, 0.4)' },
        { x: width * 0.85, y: height * 0.75, vx: -0.4, vy: -0.4, r: 260, color: 'rgba(199, 210, 254, 0.4)' },
        { x: width * 0.15, y: height * 0.8, vx: 0.5, vy: -0.3, r: 270, color: 'rgba(253, 230, 138, 0.4)' }
      ];

      function drawFluid() {
        ctx.clearRect(0, 0, width, height);
        blobs.forEach((b) => {
          b.x += b.vx;
          b.y += b.vy;
          if (b.x < -100 || b.x > width + 100) b.vx *= -1;
          if (b.y < -100 || b.y > height + 100) b.vy *= -1;

          const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
          grad.addColorStop(0, b.color);
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(drawFluid);
      }
      drawFluid();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initFluidSimulation);
    } else {
      initFluidSimulation();
    }
  </script>

    modalCloseConfirm.addEventListener('click', closeModal);

      if (e.target === modal) closeModal();
    });

    function openExperienceModal(expId) {
      const exp = TUSHAR_PROFILE.experiences.find(e => e.id === expId);
      if (!exp) return;

      modalIconWrapper.innerHTML = exp.logoImg
        ? `<img src="${exp.logoImg}" alt="${exp.company}" class="w-full h-full object-cover" />`
        : `<span class="text-base font-bold">${exp.logoText}</span>`;
      modalTitle.textContent = exp.company;
      modalSubtitle.textContent = `${exp.role} • ${exp.dates} (${exp.location})`;

      modalTags.innerHTML = exp.tags.map(t => `
        <span class="px-2.5 py-0.5 rounded-lg text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 border border-indigo-100 dark:border-indigo-900/50">${t}</span>
      `).join('');

      modalBody.innerHTML = `
        <p class="font-medium text-slate-800 dark:text-slate-200">${exp.summary}</p>
        <ul class="list-disc pl-5 space-y-2 text-slate-600 dark:text-slate-300 text-xs sm:text-sm">
          ${exp.details.map(d => `<li>${d}</li>`).join('')}
        </ul>
      `;

      openModal();
    }

    function openProjectModal(projId) {
      const proj = TUSHAR_PROFILE.projects.find(p => p.id === projId);
      if (!proj) return;

      modalIconWrapper.innerHTML = `<i class="fa-solid ${proj.icon}"></i>`;
      modalTitle.textContent = proj.title;
      modalSubtitle.textContent = `${proj.publication} • ${proj.subtitle}`;

      modalTags.innerHTML = proj.tech.map(t => `
        <span class="px-2.5 py-0.5 rounded-lg text-xs font-semibold bg-sky-50 dark:bg-sky-950/60 text-sky-600 dark:text-sky-300 border border-sky-100 dark:border-sky-900/50">${t}</span>
      `).join('');

      modalBody.innerHTML = `
        <p class="font-medium text-slate-800 dark:text-slate-200">${proj.desc}</p>
        <div class="p-3.5 bg-slate-50 dark:bg-slate-800 rounded-xl text-xs sm:text-sm leading-relaxed border border-slate-200/50 dark:border-slate-700">
          ${proj.fullDetails}
        </div>
      `;

      openModal();
    }
  </script>

  <script>
    const drawer = document.getElementById('quick-questions-drawer');
    const drawerBackdrop = document.getElementById('drawer-backdrop');
    const toggleDrawerBtn = document.getElementById('toggle-drawer-btn');
    const closeDrawerBtn = document.getElementById('close-drawer-btn');
    const drawerChevron = document.getElementById('drawer-chevron-icon');
    const drawerToggleText = document.getElementById('drawer-toggle-text');

    function openDrawer() {
      isDrawerOpen = true;
      drawer.classList.remove('translate-y-full');
      drawerBackdrop.classList.remove('hidden');
      drawerChevron.className = 'fa-solid fa-chevron-down text-[10px]';
      drawerToggleText.textContent = 'Hide quick questions';
    }

    function closeDrawer() {
      isDrawerOpen = false;
      drawer.classList.add('translate-y-full');
      drawerBackdrop.classList.add('hidden');
      drawerChevron.className = 'fa-solid fa-chevron-up text-[10px]';
      drawerToggleText.textContent = 'Quick questions';
    }

    toggleDrawerBtn.addEventListener('click', () => {
      if (isDrawerOpen) {
        closeDrawer();
      } else {
        openDrawer();
      }
    });

    closeDrawerBtn.addEventListener('click', closeDrawer);
    drawerBackdrop.addEventListener('click', closeDrawer);
    document.getElementById('drawer-drag-pill').addEventListener('click', closeDrawer);

    // Quick Question Button Click Listeners inside the Drawer
    document.querySelectorAll('.quick-question-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const question = btn.getAttribute('data-quick-q');
        closeDrawer();
        processUserQuery(question);
      });
    });

    // Category Pill Buttons (Both Hero Grid and Bottom Footer)
    document.querySelectorAll('.category-pill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.getAttribute('data-category');
        currentCategory = cat;
        if (cat === 'home') showHeroView();
        else if (cat === 'me') renderMeView();
        else if (cat === 'experience') renderExperienceView();
        else if (cat === 'projects') renderProjectsView();
        else if (cat === 'skills') renderSkillsView();
        else if (cat === 'contact') renderContactView();
      });
    });
  </script>

  <script>
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const query = chatInput.value.trim();
      if (!query) return;
      chatInput.value = '';
      processUserQuery(query);
    });

    // System prompt grounding the conversational AI in Tushar's CV
    const SYSTEM_PROMPT = `You are Tushar Sushil Phulari's interactive AI portfolio avatar. Speak in the first person ("I", "my") with a confident, warm, professional, and energetic tone matching a top-tier B2B Business Development professional.
Here are your exact background facts:
- Name: Tushar Sushil Phulari
- Current Status: 23 years old, available immediately, based in Dubai, United Arab Emirates (+91 8180071303, tusharphulari303@gmail.com, linkedin.com/in/tusharphulari303).
- Education: MBA in Marketing at Middlesex University Dubai (2026-Present, in progress); B.Tech in Instrumentation & Control Engineering from Vishwakarma Institute of Technology (VIT) Pune (2025, CGPA: 8.30).
- Professional Experience:
  1. Business Development Engineer (BDR) at Hoffmann Group India (Jan 2025 - May 2026): Managed West Region (Maharashtra & MP) then South Region (Tamil Nadu, Pondicherry, Kerala). Grew client base by 20%, delivered on-site technical cutting tool demos, achieved consecutive quarter-over-quarter quota attainment.
  2. Technical & Sales Intern at Shreeji Marketing Corporation (May 2024 - Oct 2024): Generated 40+ Sales Qualified Leads (SQLs) in 4 months via outbound calling and CRM workflows.
  3. Fabrication Intern at Phoenix Fab Industries (Dec 2023 - Jan 2024): Worked on heating furnace casing worth INR 50+ lakhs; cut design cycle by 15%.
  4. R&D Intern at OHM Automotive (May 2023 - Jun 2023): EV two-wheeler testing telemetry, improved testing efficiency by 10%.
  5. Consulting Intern at TSL Consulting (Mar 2023): Streamlined reporting by 12%.
- Certifications: Google UX Design Professional Certificate, IT Security Specialist, Prompt Engineering.
- Publications: Scopus-indexed research on "Improving Security of IoT Devices Using Blockchain", Police DBMS (JETIR), PMPL Transit (NeuroQuantology).
- Awards: National Gold Medalist, Rajya Puraskar Scout Governor's Award, NCC 'A' Certificate.

Keep your response engaging, concise (1-3 paragraphs), formatted with clear points if needed, and always invite them to ask more or schedule an interview or coffee in Dubai.`;

    async function processUserQuery(userQuery) {
      showConversationView(userQuery);
      loadingIndicator.classList.remove('hidden');
      loadingIndicator.classList.add('flex');
      contentArea.innerHTML = '';

      // Direct shortcuts for category questions
      const lower = userQuery.toLowerCase();
      if (lower.includes('experience') || lower.includes('job') || lower.includes('work experience') || lower.includes('internship')) {
        renderExperienceView();
        return;
      }
      if (lower.includes('project') || lower.includes('publication') || lower.includes('research')) {
        renderProjectsView();
        return;
      }
      if (lower.includes('skill') || lower.includes('crm') || lower.includes('hard skills') || lower.includes('soft skills')) {
        renderSkillsView();
        return;
      }
      if (lower.includes('contact') || lower.includes('reach you') || lower.includes('hire') || lower.includes('email') || lower.includes('phone') || lower.includes('whatsapp')) {
        renderContactView();
        return;
      }
      if (lower === 'tell me about yourself briefly.' || lower === 'who are you?') {
        renderMeView();
        return;
      }

      // Try calling the Gemini API (with empty API key as instructed)
      try {
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: {
            parts: [{ text: SYSTEM_PROMPT }]
          }
        };

        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) throw new Error("API call failed");

        const result = await response.json();
        const candidate = result.candidates?.[0];
        const replyText = candidate?.content?.parts?.[0]?.text;

        if (replyText) {
          renderAiChatReply(replyText);
          return;
        } else {
          throw new Error("No candidate reply");
        }
      } catch (err) {
        // Fallback intelligent response based on query
        generateFallbackResponse(userQuery);
      }
    }

    function renderAiChatReply(text) {
      loadingIndicator.classList.add('hidden');
      loadingIndicator.classList.remove('flex');

      // Convert line breaks and simple formatting
      const formattedText = text.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');

      contentArea.innerHTML = `
        <div class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl rounded-3xl p-6 sm:p-7 border border-slate-200/80 dark:border-slate-800 shadow-xl space-y-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full overflow-hidden border border-slate-200 dark:border-slate-700 shadow-sm flex-shrink-0 bg-indigo-50 dark:bg-slate-800 flex items-center justify-center">
              <img src="${userProfilePhoto}" alt="Tushar Phulari" class="ai-reply-avatar w-full h-full object-cover object-top" onerror="this.parentElement.innerHTML='<span class=\'text-xs font-bold text-indigo-600 dark:text-indigo-400\'>TP</span>';">
            </div>
            <div>
              <h4 class="text-sm font-bold text-slate-900 dark:text-white">${TUSHAR_PROFILE.name}</h4>
              <p class="text-[11px] text-slate-400 font-medium">B2B Business Development Engineer • Dubai, UAE</p>
            </div>
          </div>

          <div class="text-sm sm:text-base text-slate-700 dark:text-slate-200 leading-relaxed space-y-3">
            ${formattedText}
          </div>

          <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex flex-wrap gap-2 text-xs">
            <button onclick="renderContactView()" class="px-3.5 py-1.5 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition-colors">
              Schedule a Chat in Dubai
            </button>
            <button onclick="renderExperienceView()" class="px-3.5 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-semibold transition-colors">
              View Work Experience
            </button>
          </div>
        </div>
      `;
    }

    function generateFallbackResponse(query) {
      loadingIndicator.classList.add('hidden');
      loadingIndicator.classList.remove('flex');

      let reply = `Thank you for asking! I'm <strong>Tushar Sushil Phulari</strong>, a 23-year-old Instrumentation & Control Engineer and MBA Marketing candidate at Middlesex University Dubai with 1.5+ years of B2B industrial sales experience. At Hoffmann Group India, I consistently hit quota while expanding regional client accounts by 20%. I am based in Dubai and ready to step into a high-impact Business Development or Industrial Marketing role immediately!`;

      const q = query.toLowerCase();
      if (q.includes('resume') || q.includes('cv')) {
        reply = `You can review my complete background right here! Key highlights include 1.5+ years at Hoffmann Group India (delivering consistent quota attainment and 20% territory growth), 40+ SQLs generated at Shreeji Marketing, and my Scopus-indexed research on IoT Blockchain Security. Reach out on WhatsApp at <strong>+91 8180071303</strong> or email <strong>tusharphulari303@gmail.com</strong> for my direct PDF CV!`;
      } else if (q.includes('where') || q.includes('located') || q.includes('from')) {
        reply = `I am currently based in <strong>Dubai, United Arab Emirates</strong>, pursuing my MBA in Marketing at Middlesex University Dubai, and available to join immediately for full-time opportunities across the UAE!`;
      } else if (q.includes('why should i hire you') || q.includes('valuable')) {
        reply = `What sets me apart is the combination of <strong>deep engineering literacy (B.Tech Instrumentation & Control)</strong> and <strong>high-energy B2B sales execution</strong>. I can speak the technical language of plant managers and technical directors, while executing CRM sequences, cold calls, and quota-crushing territory strategies.`;
      }

      renderAiChatReply(reply);
    }
  </script>
