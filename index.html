<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tushar Phulari | AI Interactive Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 4s ease-in-out infinite',
            'wave': 'wave 2s ease-in-out infinite'
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-8px)' }
            },
            wave: {
              '0%, 100%': { transform: 'rotate(0deg)' },
              '20%': { transform: 'rotate(14deg)' },
              '40%': { transform: 'rotate(-10deg)' },
              '60%': { transform: 'rotate(12deg)' },
              '80%': { transform: 'rotate(-4deg)' },
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Interactive WebGL Fluid Simulation Engine -->
  <script src="webgl-fluid.js" onerror="this.onerror=null; this.src='https://cdn.jsdelivr.net/npm/webgl-fluid@0.4/dist/webgl-fluid.umd.min.js';"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    .font-heading {
      font-family: 'Outfit', sans-serif;
    }

    /* Hide scrollbars but allow smooth scrolling */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Interactive WebGL Fluid Simulation Backdrop Canvas */
    #fluid-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .dark #fluid-canvas {
      opacity: 1;
    }

    .chat-bubble {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }

    /* Smooth typing cursor animation */
    .typing-cursor::after {
      content: '|';
      animation: blink 1s step-start infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    .project-card {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .project-card:hover {
      transform: translateY(-6px) scale(1.01);
    }

    /* Character wave arm keyframe animation */
    @keyframes waveMotion {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-4deg); }
      40% { transform: rotate(4deg); }
      60% { transform: rotate(-3deg); }
      80% { transform: rotate(2deg); }
    }
    .character-waving {
      animation: waveMotion 1.4s ease-in-out;
      transform-origin: 50% 85%;
    }

    /* Drawer backdrop transitions */
    .drawer-open {
      transform: translateY(0%);
    }
    .drawer-closed {
      transform: translateY(100%);
    }
  </style>
</head>

  <script>
    /* Interactive WebGL Fluid Simulation Engine (Liquid & Smoke Dynamics) */
    const canvas = document.getElementById('fluid-canvas');

    function initFluidSimulation() {
      if (typeof WebGLFluid !== 'undefined') {
        try {
          WebGLFluid(canvas, {
            IMMEDIATE: false,
            TRIGGER: 'hover',
            AUTO: false,
            SIM_RESOLUTION: 128,
            DYE_RESOLUTION: 1024,
            CAPTURE_RESOLUTION: 512,
            DENSITY_DISSIPATION: 0.85,
            VELOCITY_DISSIPATION: 0.95,
            PRESSURE: 0.8,
            PRESSURE_ITERATIONS: 20,
            CURL: 30,
            SPLAT_RADIUS: 0.28,
            SPLAT_FORCE: 5500,
            SPLAT_COUNT: 1,
            SHADING: false,
            COLORFUL: true,
            COLOR_UPDATE_SPEED: 10,
            PAUSED: false,
            BACK_COLOR: { r: 0, g: 0, b: 0 },
            TRANSPARENT: true,
            BLOOM: false,
            SUNRAYS: false,
          });
          return;
        } catch (err) {
          console.warn('WebGL Fluid Simulation init error, falling back:', err);
        }
      }
      initFallbackFluid();
    }

    function initFallbackFluid() {
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const blobs = [
        { x: width * 0.2, y: height * 0.3, vx: 0.6, vy: 0.4, r: 240, color: 'rgba(254, 215, 170, 0.45)' },
        { x: width * 0.8, y: height * 0.2, vx: -0.5, vy: 0.6, r: 280, color: 'rgba(244, 114, 182, 0.35)' },
        { x: width * 0.5, y: height * 0.7, vx: 0.4, vy: -0.5, r: 320, color: 'rgba(167, 243, 208, 0.4)' },
        { x: width * 0.85, y: height * 0.75, vx: -0.4, vy: -0.4, r: 260, color: 'rgba(199, 210, 254, 0.4)' },
        { x: width * 0.15, y: height * 0.8, vx: 0.5, vy: -0.3, r: 270, color: 'rgba(253, 230, 138, 0.4)' }
      ];

      function drawFluid() {
        ctx.clearRect(0, 0, width, height);
        blobs.forEach((b) => {
          b.x += b.vx;
          b.y += b.vy;
          if (b.x < -100 || b.x > width + 100) b.vx *= -1;
          if (b.y < -100 || b.y > height + 100) b.vy *= -1;

          const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
          grad.addColorStop(0, b.color);
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
        });
        requestAnimationFrame(drawFluid);
      }
      drawFluid();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initFluidSimulation);
    } else {
      initFluidSimulation();
    }
  </script>

      const currentWord = titles[titleIdx];
      if (isDeleting) {
        charIdx--;
        typewriterEl.textContent = currentWord.substring(0, charIdx);
      } else {
        charIdx++;
        typewriterEl.textContent = currentWord.substring(0, charIdx);
      }

      let speed = isDeleting ? 40 : 80;

      if (!isDeleting && charIdx === currentWord.length) {
        speed = 1800; // Pause at end of word
        isDeleting = true;
      } else if (isDeleting && charIdx === 0) {
        isDeleting = false;
        titleIdx = (titleIdx + 1) % titles.length;
        speed = 400;

      setTimeout(handleTypewriter, speed);

  <script>
    const modal = document.getElementById('detail-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalSubtitle = document.getElementById('modal-subtitle');
    const modalTags = document.getElementById('modal-tags');
    const modalBody = document.getElementById('modal-body');
    const modalIconWrapper = document.getElementById('modal-icon-wrapper');
    const modalCloseBtn = document.getElementById('close-modal-btn');
    const modalCloseConfirm = document.getElementById('modal-close-confirm');

    function openModal() {
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        document.getElementById('modal-container').classList.remove('scale-95');
      }, 10);
    }

    function closeModal() {
      modal.classList.add('opacity-0');
      document.getElementById('modal-container').classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 250);
    }

    modalCloseBtn.addEventListener('click', closeModal);
    modalCloseConfirm.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    function openExperienceModal(expId) {
      const exp = TUSHAR_PROFILE.experiences.find(e => e.id === expId);

      modalIconWrapper.innerHTML = exp.logoImg

      modalTitle.textContent = exp.company;
      modalSubtitle.textContent = `${exp.role} • ${exp.dates} (${exp.location})`;

      modalTags.innerHTML = exp.tags.map(t => `
        <span class="px-2.5 py-0.5 rounded-lg text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-300 border border-indigo-100 dark:border-indigo-900/50">${t}</span>
